# Reverse proxy for a single-host deploy (EC2 + docker compose).
# TLS terminates here; certificates are mounted from /etc/letsencrypt
# (or swap in an ACM-backed ALB in front and drop the 443 server).

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

limit_req_zone $binary_remote_addr zone=webhooks:10m rate=20r/s;

server {
  listen 80;
  server_name _;
  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl;
  http2 on;
  server_name _;

  ssl_certificate     /etc/letsencrypt/live/sreai/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/sreai/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  client_max_body_size 1m;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Real-IP $remote_addr;

  # Alert sources → ingestion-service (API key auth, returns in ms).
  location /webhooks/ {
    limit_req zone=webhooks burst=200 nodelay;
    proxy_pass http://ingestion-service:3001;
  }

  # Dashboard live updates (Socket.IO over WebSocket).
  location /realtime/ {
    proxy_pass http://api-gateway:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
  }

  # REST API (prefix stripped: /api/incidents → /incidents).
  location /api/ {
    proxy_pass http://api-gateway:3000/;
  }

  location / {
    proxy_pass http://dashboard:3100;
  }
}
