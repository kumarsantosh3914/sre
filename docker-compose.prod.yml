# Production compose for a single host (build guide: EC2 + RDS + ElastiCache
# + SQS). Postgres, Redis and SQS are managed AWS services configured via
# .env.prod — nothing stateful runs on the host.
#
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
#
# On a 1 GB t2.micro keep the per-service heap caps below; on anything
# larger, raise them or remove NODE_OPTIONS.

x-service: &service
  restart: unless-stopped
  env_file: .env.prod
  logging:
    driver: json-file
    options: { max-size: '10m', max-file: '5' }

services:
  migrate:
    <<: *service
    image: ${IMAGE_PREFIX:-ghcr.io/sreai/sreai}-api-gateway:${IMAGE_TAG:-latest}
    restart: 'no'
    command: ['node', 'node_modules/@sreai/database/dist/migrate.js']

  api-gateway:
    <<: *service
    image: ${IMAGE_PREFIX:-ghcr.io/sreai/sreai}-api-gateway:${IMAGE_TAG:-latest}
    environment: { NODE_OPTIONS: '--max-old-space-size=192', AUTH_COOKIE_PATH: /api/auth }
    depends_on:
      migrate: { condition: service_completed_successfully }

  ingestion-service:
    <<: *service
    image: ${IMAGE_PREFIX:-ghcr.io/sreai/sreai}-ingestion-service:${IMAGE_TAG:-latest}
    environment: { NODE_OPTIONS: '--max-old-space-size=160' }
    depends_on:
      migrate: { condition: service_completed_successfully }

  diagnosis-service:
    <<: *service
    image: ${IMAGE_PREFIX:-ghcr.io/sreai/sreai}-diagnosis-service:${IMAGE_TAG:-latest}
    environment: { NODE_OPTIONS: '--max-old-space-size=224' }
    depends_on:
      migrate: { condition: service_completed_successfully }

  action-service:
    <<: *service
    image: ${IMAGE_PREFIX:-ghcr.io/sreai/sreai}-action-service:${IMAGE_TAG:-latest}
    environment: { NODE_OPTIONS: '--max-old-space-size=160' }
    depends_on:
      migrate: { condition: service_completed_successfully }

  dashboard:
    <<: *service
    image: ${IMAGE_PREFIX:-ghcr.io/sreai/sreai}-dashboard:${IMAGE_TAG:-latest}
    environment: { NODE_OPTIONS: '--max-old-space-size=160' }

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports: ['80:80', '443:443']
    volumes:
      - ./deploy/nginx/sreai.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on: [api-gateway, ingestion-service, dashboard]
